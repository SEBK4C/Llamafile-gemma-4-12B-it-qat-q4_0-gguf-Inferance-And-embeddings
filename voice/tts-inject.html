		<script>
		// ── gemma4 voice+controls v14 ─────────────────────────────────────────
		// ONE playback engine, ONE trigger: the per-message player. The old
		// composer auto-speak is gone — it was a second, independent Audio
		// object reading captured content while the player read the DOM (which
		// includes the rendered reasoning block): two overlapping voices.
		//
		// Trigger chain (sequential, explicit):
		//   fetch tee → capture content-only deltas per message element
		//   → user clicks ▶ on a message
		//   → stopAll() kills any other playback
		//   → golden-ratio chunker: first cut ≈120 chars at a sentence
		//     boundary (≈1 s to first audio, even mid-generation), each next
		//     chunk ×1.618 up to 1400 chars; chunk N+1 synthesizes while N
		//     plays; if the stream is still running the chunker waits for
		//     more text
		//   → when the stream ends and all chunks are played, the chunk WAVs
		//     are merged into one blob → the timeline becomes fully seekable.
		//   ⏸ pauses (chunker gates on it), ⏹ hard-stops and resets.
		// Composer keeps: 🎙 mic (red pulse while recording) · 0° · 💭.
		(() => {
			const TTS = '/tts/v1/audio/speech';
			// The Kokoro voice is a sidecar, not baked into the llamafile. Probe
			// once; without it we render no read-aloud controls (mic stays — audio
			// INPUT is part of the model itself).
			let ttsUp = null;
			fetch('/tts/health').then(r => { ttsUp = r.ok; }).catch(() => { ttsUp = false; });
			const LS_T0 = 'gemma-temp0';
			const LS_THINK = 'gemma-think-always';
			const LS_RATE = 'gemma-tts-rate';
			const LS_AUTO = 'gemma-automode';   // always-listening voice mode
			const LS_SENS = 'gemma-vad-sens';   // VAD sensitivity multiplier (2..8)
			const SEND_DELAY = 2000;            // ms of silence before an utterance sends
			const sens = () => { const v = parseFloat(localStorage.getItem(LS_SENS) || '4'); return isFinite(v) ? Math.min(8, Math.max(2, v)) : 4; };
			// Stage 2: spoken UI commands via Gemma's native function-calling from
			// audio. Tools ride ONLY on barge-in-originated sends; recognized calls
			// are executed client-side when the stream ends.
			let bargePending = false;
			const VOICE_TOOLS = [
				{ type: 'function', function: { name: 'stop_reading',
					description: 'Stop the voice/read-aloud immediately. Call for ANY request to stop, pause, be quiet, stop talking, stop speaking, stop reading, hush, or silence.',
					parameters: { type: 'object', properties: {} } } },
				{ type: 'function', function: { name: 'set_reading_speed',
					description: 'Change the read-aloud speed. Call when the user asks to read faster or slower or to slow down / speed up.',
					parameters: { type: 'object', properties: { speed: { type: 'number',
						description: 'Playback rate multiplier between 0.5 and 3.0, 1.0 = normal. Faster = higher.' } }, required: ['speed'] } } },
				{ type: 'function', function: { name: 'read_again',
					description: 'Restart reading the current answer aloud from the beginning. Call when the user asks to read it again / repeat / from the start.',
					parameters: { type: 'object', properties: {} } } },
				{ type: 'function', function: { name: 'new_chat',
					description: 'Start a new empty conversation. Call when the user asks to start over, clear the chat, or begin a new conversation.',
					parameters: { type: 'object', properties: {} } } },
				{ type: 'function', function: { name: 'regenerate',
					description: 'Regenerate/redo the last answer. Call when the user asks to try that again or regenerate.',
					parameters: { type: 'object', properties: {} } } },
			];
			const clickAria = label => {
				const b = document.querySelector(`[aria-label="${label}"]`);
				if (b) { b.click(); return true; } return false;
			};
			let lastCmdMsgEl = null;   // the message whose player triggered barge-in
			function execVoiceTool(name, argStr) {
				try {
					const a = argStr ? JSON.parse(argStr) : {};
					if (name === 'stop_reading') { stopAll(); console.log('[voice-cmd] stop'); }
					else if (name === 'set_reading_speed' && a.speed) { applyRate(a.speed); console.log('[voice-cmd] speed', a.speed); }
					else if (name === 'read_again') {
						stopAll();
						const el = lastCmdMsgEl || document.querySelector('[aria-label="Assistant message with actions"]:last-of-type');
						const btn = el && el.querySelector('.g4v-play:not(.g4v-rate)');
						if (btn) btn.click();
						console.log('[voice-cmd] read again');
					}
					else if (name === 'new_chat') { clickAria('New chat'); console.log('[voice-cmd] new chat'); }
					else if (name === 'regenerate') { clickAria('Regenerate'); console.log('[voice-cmd] regenerate'); }
				} catch (e) { console.warn('[voice-cmd]', e); }
			}
			const rate = () => Math.min(3, Math.max(0.5, parseFloat(localStorage.getItem(LS_RATE) || '1') || 1));
			const setRate = v => localStorage.setItem(LS_RATE, String(Math.min(3, Math.max(0.5, v))));
			let curAudio = null;                         // whatever is playing right now
			const rateLabels = new Set();                // every speed display, kept in sync
			function applyRate(v) {
				setRate(v);
				if (curAudio) { try { curAudio.playbackRate = rate(); } catch {} }
				for (const l of rateLabels) l.textContent = rate().toFixed(1) + '\u00d7';
			}
			const PHI = 1.618;
			const CHUNK0 = 55, CHUNK_MAX = 1400;   // small first chunk ⇒ ~0.5s synth

			const flag = (k, d) => { const v = localStorage.getItem(k); return v === null ? d : v === '1'; };
			const setFlag = (k, v) => localStorage.setItem(k, v ? '1' : '0');
			if (localStorage.getItem('LlamaUi.thinkingEnabledDefault') === null)
				localStorage.setItem('LlamaUi.thinkingEnabledDefault', 'true');

			const sanitize = t => t
				.replace(/```[\s\S]*?```|`[^`]*`/g, ' ')
				.replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
				.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
				.replace(/[*_#>|~]+/g, ' ')
				.replace(/\s+/g, ' ').trim();

			// ── content capture (content-only; reasoning deltas are ignored) ──
			const capture = new WeakMap();   // msgEl -> {text, done}
			const firstBlob = new WeakMap(); // msgEl -> prefetched first-chunk WAV Blob (instant ▶)
			let live = null;                 // {el, text, done, notify}

			// cut the first speakable chunk (>= target chars, sentence boundary if possible)
			function firstChunkText(text, target) {
				const s = text.slice(0, Math.max(target * 3, 200));
				const re = /[.!?][)"']?\s/g, ends = [];
				let x; while ((x = re.exec(s))) ends.push(x.index + x[0].length);
				let cut = ends.find(i => i >= target);
				if (cut === undefined) cut = ends.length ? ends[ends.length - 1] : Math.min(s.length, target * 2);
				return text.slice(0, cut).trim();
			}
			const synthFirst = txt => fetch(TTS, {
				method: 'POST', headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ input: txt, voice: 'af_heart' })
			}).then(r => r.ok ? r.blob() : null).catch(() => null);

			// Prefetch the first chunk's audio the moment a message finishes, so
			// clicking ▶ plays from cache (<0.2s) instead of waiting on synth (~0.5-1.5s).
			function prefetchFirst(el, text) {
				if (ttsUp !== true) return;
				if (!el || firstBlob.has(el)) return;
				const raw = firstChunkText(text, CHUNK0);   // un-sanitized slice of cap.text
				const spoken = sanitize(raw);
				if (!spoken) return;
				firstBlob.set(el, null); // reserve slot to avoid double-fetch
				synthFirst(spoken).then(b => {
					if (b) firstBlob.set(el, { raw, spoken, blob: b }); else firstBlob.delete(el);
				});
			}

			const lastMsgEl = () => {
				const all = document.querySelectorAll('[aria-label="Assistant message with actions"]');
				return all.length ? all[all.length - 1] : null;
			};

			async function harvest(stream) {
				const cap = { el: null, text: '', done: false, notify: null };
				live = cap;
				const dec = new TextDecoder(); const rd = stream.getReader();
				let buf = '';
				for (;;) {
					const { done, value } = await rd.read();
					if (done) break;
					buf += dec.decode(value, { stream: true });
					const lines = buf.split('\n'); buf = lines.pop();
					for (const ln of lines) {
						if (!ln.startsWith('data: ')) continue;
						const p = ln.slice(6).trim();
						if (p === '[DONE]') continue;
						try {
							const j = JSON.parse(p);
							const c = j.choices && j.choices[0];
							const d = (c && (c.delta || c.message)) || {};
							if (d.tool_calls) {
								for (const t of d.tool_calls) {
									const i = t.index || 0;
									cap.tc = cap.tc || {};
									cap.tc[i] = cap.tc[i] || { name: '', args: '' };
									if (t.function && t.function.name) cap.tc[i].name += t.function.name;
									if (t.function && t.function.arguments) cap.tc[i].args += t.function.arguments;
								}
							}
							if (d.content) {
								cap.text += d.content;
								if (!cap.el) {
									const el = lastMsgEl();
									if (el) { cap.el = el; capture.set(el, cap); }
								}
								if (cap.notify) cap.notify();
							}
						} catch {}
					}
				}
				cap.done = true;
				if (cap.tc) for (const k of Object.values(cap.tc)) execVoiceTool(k.name, k.args);
				if (!cap.el) {
					setTimeout(() => { const el = lastMsgEl(); if (el) { cap.el = el; capture.set(el, cap); prefetchFirst(el, cap.text); } }, 400);
				} else {
					prefetchFirst(cap.el, cap.text);   // warm the first chunk for instant ▶
				}
				if (cap.notify) cap.notify();
				if (live === cap) setTimeout(() => { if (live === cap) live = null; }, 500);
				setTimeout(ensurePlayers, 600);
			}

			// ── request rewriting (0° and 💭 toggles) ─────────────────────────
			function rewriteBody(txt) {
				try {
					const b = JSON.parse(txt);
					if (flag(LS_THINK, true)) {
						b.chat_template_kwargs = { ...(b.chat_template_kwargs || {}), enable_thinking: true };
						if (b.thinking_budget_tokens === 0) delete b.thinking_budget_tokens;
					}
					if (flag(LS_T0, false)) b.temperature = 0;
					if (bargePending) {
						bargePending = false;
						b.tools = [...VOICE_TOOLS, ...(b.tools || [])];
						b.tool_choice = 'auto';
					}
					return JSON.stringify(b);
				} catch { return txt; }
			}

			const orig = window.fetch;
			window.fetch = function (input, init) {
				const url = typeof input === 'string' ? input : (input && input.url) || '';
				if (!/\/chat\/completions/.test(url)) return orig.apply(this, arguments);
				if (init && typeof init.body === 'string') init = { ...init, body: rewriteBody(init.body) };
				return orig.call(this, input, init).then(resp => {
					try {
						const ct = resp.headers.get('content-type') || '';
						if (resp.ok && resp.body && ct.includes('text/event-stream')) {
							const [a, b] = resp.body.tee();
							harvest(b);
							return new Response(a, resp);
						}
						if (resp.ok && ct.includes('application/json')) {
							resp.clone().json().then(j => {
								const m = j.choices && j.choices[0] && j.choices[0].message;
								if (m && m.content) {
									const el = lastMsgEl();
									if (el) capture.set(el, { el, text: m.content, done: true, notify: null });
									setTimeout(ensurePlayers, 600);
								}
							}).catch(() => {});
						}
					} catch {}
					return resp;
				});
			};

			// ── single global playback engine ─────────────────────────────────
			let engine = null; // {stop(), pauseToggle(), btn}
			function stopAll() { if (engine) { const e = engine; engine = null; e.stop(); } }

			const synth = text => fetch(TTS, {
				method: 'POST', headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ input: text, voice: 'af_heart' })
			}).then(r => { if (!r.ok) throw new Error('tts ' + r.status); return r.blob(); });

			// cut a chunk of >= target chars at a sentence boundary (or all of it)
			function cutChunk(text, from, target, force) {
				const rest = text.slice(from);
				if (!rest.trim()) return null;
				if (rest.length < target && !force) return null;
				const win = rest.slice(0, Math.max(target * 2, target + 200));
				let cut = -1;
				const re = /[.!?][)"']?\s/g; let m;
				while ((m = re.exec(win))) { if (m.index + 2 >= target || cut === -1) cut = m.index + m[0].length; if (m.index + 2 >= target) break; }
				if (cut === -1 || cut < target * 0.4) cut = force ? rest.length : (rest.length >= target * 2 ? target : -1);
				if (cut === -1) return null;
				return { text: rest.slice(0, cut), next: from + cut };
			}

			// ── karaoke: wrap words in spans, sentence-level audio, word highlight ──
			// Word timing = proportional chars-within-sentence interpolation (Kokoro
			// has no timestamps but speaks at a near-uniform rate).
			const norm = w => w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');

			function buildKaraoke(msgEl, capText) {
				// Svelte re-renders (markdown blocks stabilizing, list updates) replace
				// our spans with fresh nodes — detect and re-wrap instead of
				// highlighting detached elements. Audio cache survives via text keys.
				if (msgEl.__g4v) {
					const w0 = msgEl.__g4v.words[0];
					if (w0 && w0.span.isConnected) return msgEl.__g4v;
					const oldAudio = msgEl.__g4v.audio;
					delete msgEl.__g4v;
					const k = buildKaraoke(msgEl, capText);
					k.audio = oldAudio;                 // text-keyed: still valid
					return k;
				}
				// wrap every word in the message body (skip code, our controls)
				const walker = document.createTreeWalker(msgEl, NodeFilter.SHOW_TEXT, { acceptNode(n) {
					const p = n.parentElement;
					if (!p || p.closest('.g4v-ctl,pre,code,button,textarea,[data-collapsible-root],.info')) return NodeFilter.FILTER_REJECT;
					return n.textContent.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
				}});
				const nodes = []; let n;
				while ((n = walker.nextNode())) nodes.push(n);
				const words = [];
				for (const t of nodes) {
					const frag = document.createDocumentFragment();
					for (const part of t.textContent.split(/(\s+)/)) {
						if (!part) continue;
						if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
						const s = document.createElement('span');
						s.className = 'g4v-w'; s.textContent = part; s.dataset.i = words.length;
						words.push({ span: s, text: part });
						frag.appendChild(s);
					}
					t.parentNode.replaceChild(frag, t);
				}
				// align to captured content-only text: skip DOM words that belong to
				// the reasoning block (rendered before the answer) by locating where
				// the capture's first tokens appear in the DOM word list.
				let start = 0;
				if (capText) {
					const capToks = sanitize(capText).split(/\s+/).map(norm).filter(Boolean).slice(0, 6);
					if (capToks.length >= 3) {
						for (let i = 0; i <= words.length - capToks.length; i++) {
							let ok = 0;
							for (let j = 0; j < capToks.length; j++) {
								if (norm(words[i + j].text) === capToks[j]) ok++;
							}
							if (ok >= capToks.length - 1) { start = i; break; }
						}
					}
				}
				// group speakable words into sentences
				const sents = []; let cur = [];
				for (let i = start; i < words.length; i++) {
					cur.push(i);
					const w = words[i].text;
					if ((/[.!?…][)"']?$/.test(w) && cur.length >= 3) || cur.length >= 60) { sents.push(cur); cur = []; }
				}
				if (cur.length) sents.push(cur);
				const k = { words, sents, audio: new Map() };  // audio: sentIdx(+offset key) -> Blob
				msgEl.__g4v = k;
				return k;
			}

			function clearHl(k) { for (const w of k.words) w.span.classList.remove('g4v-hl'); }

			// Speak sentences fromSent..end, starting mid-sentence at word fromWord.
			async function playKaraoke(msgEl, btn, kIn, fromSent, fromWord) {
				let k = kIn;
				let aborted = false, paused = false, audio = null;
				// follow-latch: ANY user scroll intent stops auto-follow until the
				// user returns to the reading (word visible again) or clicks play/word
				let follow = true;
				const unfollow = () => { follow = false; };
				const navEvs = ['wheel', 'touchmove'];
				for (const ev of navEvs) addEventListener(ev, unfollow, { passive: true });
				const keyNav = e => { if (['PageUp','PageDown','ArrowUp','ArrowDown','Home','End',' '].includes(e.key)) unfollow(); };
				addEventListener('keydown', keyNav, { passive: true });
				const detach = () => { for (const ev of navEvs) removeEventListener(ev, unfollow); removeEventListener('keydown', keyNav); };
				const setIdle = () => { btn.textContent = '▶'; btn.classList.remove('g4v-spin'); clearHl(k); };
				engine = {
					btn,
					stop() { aborted = true; detach(); if (audio) try { audio.pause(); } catch {} setIdle(); },
					pauseToggle() {
						paused = !paused;
						if (audio) { paused ? audio.pause() : audio.play().catch(() => {}); }
						btn.textContent = paused ? '▶' : '⏸';
					}
				};
				btn.textContent = '⟳'; btn.classList.add('g4v-spin');
				const sentText = (si, w0) => {
					const idxs = k.sents[si].filter(i => i >= (w0 || 0));
					return sanitize(idxs.map(i => k.words[i].text).join(' '));
				};
				const fetchSent = (si, w0) => {
					const t = sentText(si, w0);
					if (!t) return Promise.resolve(null);
					if (k.audio.has(t)) return Promise.resolve(k.audio.get(t));
					return synth(t).then(b => { k.audio.set(t, b); return b; }).catch(() => null);
				};
				let pending = fetchSent(fromSent, fromWord);
				for (let si = fromSent; si < k.sents.length; si++) {
					if (aborted) return;
					// re-wrap if a Svelte re-render destroyed the spans mid-read
					const probe = k.words[k.sents[si][0]];
					if (probe && !probe.span.isConnected) {
						const fresh = buildKaraoke(msgEl, '');
						if (fresh.sents.length === k.sents.length) k = fresh;
						else { k = fresh; if (si >= k.sents.length) break; }
					}
					const w0 = si === fromSent ? fromWord : 0;
					const blob = await pending;
					pending = si + 1 < k.sents.length ? fetchSent(si + 1, 0) : null;
					if (aborted) return;
					if (!blob) continue;                       // failed/empty chunk: skip, don't die
					const idxs = k.sents[si].filter(i => i >= w0);
					const lens = idxs.map(i => k.words[i].text.length + 1);
					const total = lens.reduce((a, b) => a + b, 0);
					while (paused && !aborted) await new Promise(r => setTimeout(r, 120));
					if (aborted) return;
					try {
						await new Promise((res) => {
							audio = new Audio(URL.createObjectURL(blob));
							try { audio.preservesPitch = true; } catch {}
							audio.playbackRate = rate();
							curAudio = audio;
							audio.onended = res;
							audio.onerror = res;               // skip broken audio, keep reading
							audio.onplay = () => { if (!aborted && !paused) btn.textContent = '⏸'; btn.classList.remove('g4v-spin'); };
							audio.ontimeupdate = () => {
								if (aborted || !audio.duration) return;
								const p = audio.currentTime / audio.duration;
								let acc = 0, hi = idxs[idxs.length - 1];
								for (let j = 0; j < idxs.length; j++) { acc += lens[j]; if (acc / total >= p) { hi = idxs[j]; break; } }
								for (const i of idxs) k.words[i].span.classList.toggle('g4v-hl', i === hi);
								const rct = k.words[hi].span.getBoundingClientRect();
							const visible = rct.top >= 0 && rct.bottom <= window.innerHeight;
							if (!follow && visible) follow = true;       // user came back: resume
							if (follow && !visible) k.words[hi].span.scrollIntoView({ block: 'nearest' });
							};
							if (paused) {
								const w = setInterval(() => {
									if (aborted) { clearInterval(w); res(); }
									else if (!paused) { clearInterval(w); audio.play().catch(res); }
								}, 120);
							} else audio.play().catch(res);
						});
					} catch {}
					for (const i of idxs) k.words[i].span.classList.remove('g4v-hl');
				}
				detach();
				if (!aborted) { if (engine && engine.btn === btn) engine = null; setIdle(); }
			}

			// live streaming read (message still generating): no highlights yet,
			// per-chunk failures are skipped, prefetched first chunk plays instantly.
			async function playStreamingLive(msgEl, btn, cap) {
				let aborted = false, paused = false, audio = null;
				const setIdle = () => { btn.textContent = '▶'; btn.classList.remove('g4v-spin'); };
				engine = {
					btn,
					stop() { aborted = true; if (audio) try { audio.pause(); } catch {} setIdle(); },
					pauseToggle() {
						paused = !paused;
						if (audio) { paused ? audio.pause() : audio.play().catch(() => {}); }
						btn.textContent = paused ? '▶' : '⏸';
					}
				};
				btn.textContent = '⟳'; btn.classList.add('g4v-spin');
				const waitText = () => new Promise(res => { cap.notify = res; setTimeout(res, 1500); });
				let from = 0, target = CHUNK0, usedPrefetch = false;
				const pf = firstBlob.get(msgEl);
				const nextBlob = async () => {
					for (;;) {
						if (aborted) return null;
						if (!usedPrefetch && pf && pf.blob && cap.text.startsWith(pf.raw.slice(0, 12))) {
							usedPrefetch = true; from = pf.raw.length;
							target = Math.min(Math.round(CHUNK0 * PHI), CHUNK_MAX);
							return pf.blob;
						}
						const c = cutChunk(cap.text, from, target, cap.done);
						if (c) {
							from = c.next; target = Math.min(Math.round(target * PHI), CHUNK_MAX);
							const s = sanitize(c.text);
							if (!s) continue;
							const b = await synth(s).catch(() => null);
							if (b) return b;                    // synth failure: skip chunk, keep going
							continue;
						}
						if (cap.done) return null;
						await waitText();
					}
				};
				let pending = nextBlob();
				for (;;) {
					if (aborted) return;
					const blob = await pending;
					if (aborted || !blob) break;
					pending = nextBlob();
					while (paused && !aborted) await new Promise(r => setTimeout(r, 120));
					if (aborted) return;
					await new Promise((res) => {
						audio = new Audio(URL.createObjectURL(blob));
						try { audio.preservesPitch = true; } catch {}
						audio.playbackRate = rate();
						curAudio = audio;
						audio.onended = res;
						audio.onerror = res;                   // never kills the pipeline
						audio.onplay = () => { if (!aborted && !paused) { btn.textContent = '⏸'; btn.classList.remove('g4v-spin'); } };
						if (paused) {
							const w = setInterval(() => {
								if (aborted) { clearInterval(w); res(); }
								else if (!paused) { clearInterval(w); audio.play().catch(res); }
							}, 120);
						} else audio.play().catch(res);
					});
				}
				if (!aborted) { if (engine && engine.btn === btn) engine = null; setIdle(); }
			}

			function buildControls(msgEl) {
				const wrap = document.createElement('span');
				wrap.className = 'g4v-ctl';
				const btn = document.createElement('button');
				btn.className = 'g4v-play';
				btn.type = 'button';
				btn.textContent = '▶';
				btn.title = 'Read aloud · click any word to jump there · ⏸ pauses';
				const slower = document.createElement('button');
				slower.className = 'g4v-play g4v-rate'; slower.type = 'button';
				slower.textContent = '\u00ab'; slower.title = 'Read slower';
				const lbl = document.createElement('span');
				lbl.className = 'g4v-ratelbl'; lbl.textContent = rate().toFixed(1) + '\u00d7';
				lbl.title = 'Reading speed (click to reset to 1.0\u00d7)';
				rateLabels.add(lbl);
				const faster = document.createElement('button');
				faster.className = 'g4v-play g4v-rate'; faster.type = 'button';
				faster.textContent = '\u00bb'; faster.title = 'Read faster';
				slower.onclick = () => applyRate(rate() - 0.2);
				faster.onclick = () => applyRate(rate() + 0.2);
				lbl.onclick = () => applyRate(1);
				wrap.append(slower, btn, lbl, faster);

				const startKaraoke = (fromSent, fromWord) => {
					stopAll();
					const cap = capture.get(msgEl);
					const k = buildKaraoke(msgEl, cap ? cap.text : '');
					if (!k.sents.length) return;
					playKaraoke(msgEl, btn, k, fromSent, fromWord);
				};

				btn.onclick = () => {
					if (engine && engine.btn === btn) { engine.pauseToggle(); return; }
					stopAll();
					const cap = capture.get(msgEl) || (live && live.el === msgEl ? live : null);
					if (cap && !cap.done) { playStreamingLive(msgEl, btn, cap); return; }
					startKaraoke(0, 0);
				};

				// click a word -> jump playback there (works before/behind, play or paused)
				if (msgEl.__g4vClick) return wrap;
				msgEl.__g4vClick = true;
				msgEl.addEventListener('click', e => {
					const w = e.target.closest && e.target.closest('.g4v-w');
					if (!w || !msgEl.__g4v) return;
					const i = parseInt(w.dataset.i, 10);
					const k = msgEl.__g4v;
					const si = k.sents.findIndex(s => s.includes(i));
					if (si === -1) return;
					clearHl(k);
					startKaraoke(si, i);
				});
				return wrap;
			}

			function ensurePlayers() {
				if (ttsUp !== true) return;
				for (const msg of document.querySelectorAll('[aria-label="Assistant message with actions"]')) {
					const ctl = msg.querySelector('.g4v-ctl') || buildControls(msg);
					// keep the controls directly above the ANSWER body (i.e. below the
					// reasoning dropdown) — reposition as the message DOM fills in
					const ans = Array.from(msg.querySelectorAll('.agentic-text')).find(e => !e.closest('[data-collapsible-root]'));
					if (ans) {
						if (ans.previousElementSibling !== ctl) ans.insertAdjacentElement('beforebegin', ctl);
					} else {
						const reas = msg.querySelector('[data-collapsible-root]');
						if (reas) { if (reas.nextElementSibling !== ctl) reas.insertAdjacentElement('afterend', ctl); }
						else if (!ctl.isConnected) msg.insertAdjacentElement('afterbegin', ctl);
					}
				}
			}

			// ── auto voice mode: always-listening, 2s send-delay, command-aware ─
			// One persistent mic monitor (adaptive energy VAD, no external model).
			// States: idle (listening) -> hearing (recording speech) -> countdown
			// (2s silence window, ring fills; resuming speech reopens & appends) ->
			// send (or HOLD until generation finishes). Clicking the button during
			// hearing/countdown CANCELS the utterance; clicking while idle turns the
			// mode off. If the model is reading aloud when you speak, it pauses.
			let auto = null;              // {media,ctx,node,stop()}
			let autoState = 'off';        // off|idle|hearing|countdown|holding
			let autoFrames = [];          // Float32Array chunks of the current utterance
			let autoBtnRef = null, autoStatusRef = null;
			let cdStart = 0, cdRAF = 0;

			function setAutoState(s) {
				autoState = s;
				if (autoBtnRef) {
					autoBtnRef.classList.toggle('g4v-hearing', s === 'hearing');
					if (s !== 'countdown') autoBtnRef.style.setProperty('--deg', '0deg');
				}
				paintAutoStatus();
			}
			function paintAutoStatus() {
				if (!autoStatusRef) return;
				const map = { off: 'off', idle: 'listening…', hearing: 'hearing you…',
					countdown: 'sending in ' + Math.max(0, (SEND_DELAY - (performance.now() - cdStart)) / 1000).toFixed(1) + 's',
					holding: 'waiting for the model…' };
				autoStatusRef.textContent = 'Status: ' + (map[autoState] || autoState);
			}

			function autoFlash() {
				if (!autoBtnRef) return;
				autoBtnRef.classList.add('g4v-flash');
				setTimeout(() => autoBtnRef && autoBtnRef.classList.remove('g4v-flash'), 350);
			}

			function autoSend() {
				const total = autoFrames.reduce((a, c) => a + c.length, 0);
				const flat = new Float32Array(total);
				let o = 0; for (const c of autoFrames) { flat.set(c, o); o += c.length; }
				autoFrames = [];
				if (total < 16000 * 0.4) { setAutoState('idle'); return; }   // too short: ignore
				attachToUi(encodeWav(flat, 16000));
				bargePending = true;
				autoFlash();
				const trySend = (tries) => {
					const form = Array.from(document.querySelectorAll('form')).find(f => f.querySelector('textarea'));
					const send = form && form.querySelector('button[type="submit"]');
					// hold until the model is free to accept a new message
					if (send && !send.disabled && !document.querySelector('[aria-label="Stop generation"]')) {
						send.click(); setAutoState('idle');
					} else if (tries < 400) { setAutoState('holding'); setTimeout(() => trySend(tries + 1), 300); }
					else { setAutoState('idle'); }
				};
				trySend(0);
			}

			function cancelUtterance() {
				autoFrames = [];
				cancelAnimationFrame(cdRAF);
				if (autoState !== 'off') setAutoState('idle');
			}

			function cdTick() {
				const left = SEND_DELAY - (performance.now() - cdStart);
				const pct = Math.min(1, (performance.now() - cdStart) / SEND_DELAY);
				if (autoBtnRef) autoBtnRef.style.setProperty('--deg', (pct * 360) + 'deg');
				paintAutoStatus();
				if (left <= 0) { setAutoState('idle'); autoSend(); return; }
				if (autoState === 'countdown') cdRAF = requestAnimationFrame(cdTick);
			}

			async function autoStart() {
				if (auto) return;
				try {
					const media = await navigator.mediaDevices.getUserMedia({ audio: true });
					const ctx = new AudioContext({ sampleRate: 16000 });
					const srcN = ctx.createMediaStreamSource(media);
					const node = ctx.createScriptProcessor(2048, 1, 1);
					let noise = 0.003, speechMs = 0;
					setAutoState('idle');
					node.onaudioprocess = e => {
						const d = e.inputBuffer.getChannelData(0);
						let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i];
						const rms = Math.sqrt(s / d.length);
						const frameMs = (d.length / 16000) * 1000;
						const speaking = rms > Math.max(0.012, noise * sens());
						if (autoState === 'idle') {
							if (speaking) { speechMs += frameMs; } else { speechMs = 0; noise = noise * 0.95 + rms * 0.05; }
							if (speechMs > 200) {                    // real speech starts
								autoFrames = []; speechMs = 0;
								if (engine && engine.pauseToggle) engine.pauseToggle();   // yield the read-aloud
								setAutoState('hearing');
							}
						}
						if (autoState === 'hearing') {
							autoFrames.push(new Float32Array(d));
							if (!speaking) {                          // pause detected -> open the 2s window
								cdStart = performance.now();
								setAutoState('countdown');
								cancelAnimationFrame(cdRAF); cdRAF = requestAnimationFrame(cdTick);
							}
						} else if (autoState === 'countdown') {
							autoFrames.push(new Float32Array(d));     // keep capturing during the window
							if (speaking) {                           // resumed talking -> reopen, append, reset timer
								cancelAnimationFrame(cdRAF);
								setAutoState('hearing');
							}
						}
					};
					srcN.connect(node); node.connect(ctx.destination);
					auto = { media, ctx, srcN, node, stop() {
						try { node.disconnect(); srcN.disconnect(); media.getTracks().forEach(t => t.stop()); ctx.close(); } catch {}
					}};
				} catch (e) { console.warn('[auto]', e); setFlag(LS_AUTO, false); if (autoBtnRef) paintAuto(); }
			}
			function autoStop() {
				cancelAnimationFrame(cdRAF); autoFrames = [];
				if (auto) { const a = auto; auto = null; a.stop(); }
				setAutoState('off');
			}
			let paintAuto = () => {};   // reassigned when the button is built


			// ── recorder + composer buttons (auto-speak removed) ──────────────
			let rec = null;
			function encodeWav(samples, rate) {
				const n = samples.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
				const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
				ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
				v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
				v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true);
				v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 2, true);
				for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i * 2, s < 0 ? s * 32768 : s * 32767, true); }
				return new Blob([buf], { type: 'audio/wav' });
			}
			async function startRec() {
				const media = await navigator.mediaDevices.getUserMedia({ audio: true });
				const ctx = new AudioContext({ sampleRate: 16000 });
				const src = ctx.createMediaStreamSource(media);
				const node = ctx.createScriptProcessor(4096, 1, 1);
				const samples = [];
				node.onaudioprocess = e => samples.push(new Float32Array(e.inputBuffer.getChannelData(0)));
				src.connect(node); node.connect(ctx.destination);
				rec = { ctx, node, src, media, samples };
			}
			async function stopRec() {
				const r = rec; rec = null;
				r.node.disconnect(); r.src.disconnect();
				r.media.getTracks().forEach(t => t.stop());
				await r.ctx.close();
				const total = r.samples.reduce((a, c) => a + c.length, 0);
				const flat = new Float32Array(total); let o = 0;
				for (const c of r.samples) { flat.set(c, o); o += c.length; }
				return encodeWav(flat, 16000);
			}
			function attachToUi(blob) {
				const inp = document.querySelector('input[type="file"]');
				if (!inp) return;
				const dt = new DataTransfer();
				dt.items.add(new File([blob], 'recording-' + Date.now() + '.wav', { type: 'audio/wav' }));
				inp.files = dt.files;
				inp.dispatchEvent(new Event('change', { bubbles: true }));
			}

			const style = document.createElement('style');
			style.textContent =
				'@keyframes g4vpulse{0%,100%{background:#b71c1c}50%{background:#e53935}}' +
				'.g4v-rec{animation:g4vpulse 1.2s infinite;color:#fff !important}' +
				'@keyframes g4vspin{to{transform:rotate(360deg)}}' +
				'.g4v-spin{animation:g4vspin 1s linear infinite}' +
				'.g4v-w{cursor:pointer;border-radius:3px}' +
				'.g4v-w:hover{background:#4caf5030}' +
				'.g4v-hl{background:#2e7d32;color:#fff}' +
				'.g4v-play{width:24px;height:24px;border-radius:50%;border:1px solid #555;background:#1b1f20;color:#eee;cursor:pointer;font-size:11px;line-height:1;display:inline-flex;align-items:center;justify-content:center;opacity:.8}' +
				'.g4v-play:hover{opacity:1}' +
				'.g4v-ctl{display:flex;align-items:center;gap:5px}' +
				'.g4v-rate{width:20px;height:20px;font-size:12px}' +
				'.g4v-ratelbl{font:11px system-ui;color:#888;cursor:pointer;min-width:30px;text-align:center}' +
				'.g4v-autowrap{position:relative;display:inline-flex}' +
				'.g4v-auto{position:relative;--deg:0deg}' +
				'.g4v-auto .g4v-autoglyph{position:relative;z-index:1}' +
				'.g4v-auto .g4v-autodot{position:absolute;top:1px;right:2px;font-size:8px;color:#888;z-index:2}' +
				'.g4v-auto.g4v-auto-on .g4v-autodot{color:#e53935}' +
				'.g4v-auto.g4v-auto-on{box-shadow:0 0 0 1px #e5393566}' +
				/* countdown ring: conic fill transparent->solid red as send approaches */
				'.g4v-auto::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#e53935 var(--deg),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));pointer-events:none;opacity:.9}' +
				'.g4v-auto.g4v-hearing{box-shadow:0 0 0 2px #e53935}' +
				'@keyframes g4vflash{0%{box-shadow:0 0 0 6px #e5393500}40%{box-shadow:0 0 0 4px #e53935cc}100%{box-shadow:0 0 0 8px #e5393500}}' +
				'.g4v-auto.g4v-flash{animation:g4vflash .35s ease-out}' +
				'.g4v-autocard{position:absolute;bottom:120%;left:50%;transform:translateX(-50%);width:250px;background:#1b1f20;color:#ddd;border:1px solid #444;border-radius:8px;padding:8px 10px;font:11px system-ui;line-height:1.4;box-shadow:0 4px 14px #0008;opacity:0;visibility:hidden;transition:opacity .12s;z-index:99999}' +
				'.g4v-autowrap:hover .g4v-autocard{opacity:1;visibility:visible}' +
				'.g4v-autocard .g4v-cmds{margin-top:5px;color:#aaa}' +
				'.g4v-autocard .g4v-status{margin-top:6px;color:#4caf50;font-weight:600}' +
				'.g4v-autocard .g4v-sens{display:flex;align-items:center;gap:6px;margin-top:6px;color:#aaa}' +
				'.g4v-autocard .g4v-sens input{flex:1;accent-color:#e53935}';
			document.documentElement.appendChild(style);

			function findSend() {
				for (const f of document.querySelectorAll('form')) {
					if (!f.querySelector('textarea')) continue;
					const b = f.querySelector('button[type="submit"]');
					if (b) return b;
				}
				return null;
			}
			function mkBadge(on) {
				const b = document.createElement('span');
				b.textContent = '✓';
				b.style.cssText = 'position:absolute;top:-4px;right:-4px;font-size:11px;background:#2e7d32;color:#fff;border-radius:50%;width:15px;height:15px;line-height:15px;text-align:center;pointer-events:none';
				b.style.display = on ? 'block' : 'none';
				return b;
			}
			function ensureButtons() {
				const send = findSend();
				if (!send || send.parentElement.querySelector('.g4v-btn')) return;
				const mk = (label, title) => {
					const b = document.createElement('button');
					b.type = 'button'; b.className = send.className; b.classList.add('g4v-btn');
					b.title = title; b.style.position = 'relative'; b.textContent = label;
					return b;
				};
				const mic = mk('🎙', 'Record audio message (red = recording; click again to stop & attach)');
				mic.onclick = async () => {
					try {
						if (!rec) { await startRec(); mic.textContent = '⏺'; mic.classList.add('g4v-rec'); }
						else { mic.textContent = '🎙'; mic.classList.remove('g4v-rec'); attachToUi(await stopRec()); }
					} catch (e) { console.warn('[mic]', e); mic.textContent = '🎙'; mic.classList.remove('g4v-rec'); rec = null; }
				};
				// ── auto voice mode button (checkmark + red dot, countdown ring) ──
				const autoWrap = document.createElement('span');
				autoWrap.className = 'g4v-autowrap';
				const autoBtn = mk('🎙', '');   // glyph replaced below
				autoBtn.classList.add('g4v-auto');
				autoBtn.innerHTML = '<span class="g4v-autoglyph">🎙</span><span class="g4v-autodot">●</span>';
				autoBtnRef = autoBtn;
				// hover card: command list + live status + sensitivity
				const card = document.createElement('div');
				card.className = 'g4v-autocard';
				card.innerHTML =
					'<b>Auto voice mode</b> — always listening. Speak a command or a question;' +
					' it sends 2s after you stop (keep talking to extend).' +
					'<div class="g4v-cmds"><b>Commands:</b> “stop” · “read faster / slow down” ·' +
					' “read that again” · “new conversation” · “try that again”</div>' +
					'<div class="g4v-status">Status: off</div>' +
					'<label class="g4v-sens">Sensitivity <input type="range" min="2" max="8" step="0.5"></label>';
				autoStatusRef = card.querySelector('.g4v-status');
				const sensInput = card.querySelector('input');
				sensInput.value = sens();
				sensInput.oninput = () => localStorage.setItem(LS_SENS, sensInput.value);
				autoWrap.append(autoBtn, card);
				paintAuto = () => {
					const on = flag(LS_AUTO, false);
					autoBtn.classList.toggle('g4v-auto-on', on);
					autoBtn.title = on ? 'Auto voice mode ON — hover for commands; click while it is about to send to cancel'
						: 'Auto voice mode (always listening for voice commands) — click to enable';
				};
				paintAuto();
				autoBtn.onclick = () => {
					if (autoState === 'hearing' || autoState === 'countdown') { cancelUtterance(); return; }
					const on = !flag(LS_AUTO, false);
					setFlag(LS_AUTO, on); paintAuto();
					if (on) autoStart(); else autoStop();
				};
				if (flag(LS_AUTO, false)) autoStart();   // resume across reloads

				send.parentElement.insertBefore(mic, send);       // [🎙][🎙auto][Send]
				send.parentElement.insertBefore(autoWrap, send);
			}

			// ── 0° and 💭 toggles inside the composer "+" menu ────────────────
			function ensureMenuItems() {
				for (const menu of document.querySelectorAll('[data-slot="dropdown-menu-content"]')) {
					if (menu.querySelector('.g4v-mi')) continue;
					const items = Array.from(menu.querySelectorAll('[data-slot="dropdown-menu-item"],[data-slot="dropdown-menu-sub-trigger"]'));
					if (!items.length || !/add files/i.test(menu.textContent || '')) continue;   // only the + menu
					const proto = items[items.length - 1];
					const mkItem = (label, get, toggle) => {
						const it = document.createElement('div');
						it.className = proto.className;
						it.classList.add('g4v-mi');
						it.setAttribute('role', 'menuitem');
						it.style.cursor = 'pointer';
						const paint = () => { it.textContent = (get() ? '✓ ' : '\u2003') + label; };
						paint();
						it.addEventListener('click', e => { e.stopPropagation(); toggle(); paint(); });
						return it;
					};
					menu.appendChild(mkItem('0\u00b0 Temperature zero', () => flag(LS_T0, false),
						() => setFlag(LS_T0, !flag(LS_T0, false))));
					menu.appendChild(mkItem('\ud83d\udcad Reason every turn', () => flag(LS_THINK, true),
						() => setFlag(LS_THINK, !flag(LS_THINK, true))));
				}
			}

			let raf = 0;
			new MutationObserver(() => {
				cancelAnimationFrame(raf);
				raf = requestAnimationFrame(() => { ensureButtons(); ensurePlayers(); ensureMenuItems(); });
			}).observe(document.documentElement, { childList: true, subtree: true });
			addEventListener('DOMContentLoaded', () => { ensureButtons(); ensurePlayers(); ensureMenuItems(); });
		})();
		</script>
	</body>
